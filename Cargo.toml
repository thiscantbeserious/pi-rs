[workspace]
resolver = "2"
members = [
  "crates/pi-core",
  "crates/pi-protocol",
  "crates/pi-render",
  "crates/pi-replay",
  "crates/pi-rs",
  "crates/pi-session",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/thiscantbeserious/pi-rs"
authors = ["pi-rs contributors"]

[workspace.dependencies]
# Crates depend on each other via the workspace table so versions stay unified.
pi-core = { path = "crates/pi-core" }
pi-protocol = { path = "crates/pi-protocol" }
pi-render = { path = "crates/pi-render" }
pi-replay = { path = "crates/pi-replay" }
pi-session = { path = "crates/pi-session" }

# Render-thread deps (ADR 0024/0026). Workspace-unified so the P16
# duplicate-version guard (cargo deny) holds across crates.
ratatui = { version = "0.30", default-features = false }
crossterm = "0.29"

# Shared dependencies, referenced by crates as `insta.workspace = true` so
# versions stay unified across the workspace (pitfall P16 guard starts here).
insta = "1"

# Auto-installs git hooks (pre-push: fmt + clippy + test) on cargo test/build.
# No manual setup script needed. Skip with git push --no-verify.
cargo-husky = { version = "1", features = ["run-cargo-fmt", "run-cargo-clippy", "run-cargo-test", "prepush-hook"] }

# Shared dev/profile settings. Release stays LTO + single codegen unit for the
# shipped binary; crates inherit via `profile.release` at the workspace root.
[profile.release]
lto = true
codegen-units = 1
