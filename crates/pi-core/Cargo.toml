[package]
name = "pi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pi-rs Core: TUI, renderer, agent loop"

[lib]
name = "pi_core"
path = "src/lib.rs"

[dependencies]
pi-protocol.workspace = true
tokio = { version = "1", features = ["net", "io-util", "rt"] }
rmp-serde = "1"

[dev-dependencies]
insta.workspace = true
tokio = { version = "1", features = ["net", "io-util", "macros", "rt"] }
tempfile = "3"
