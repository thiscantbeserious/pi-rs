[package]
name = "pi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pi-rs Core: TUI, renderer, agent loop"

[lib]
name = "pi_core"
path = "src/lib.rs"

[[bin]]
name = "mock-host"
path = "src/bin/mock_host.rs"
harness = false
test = false
bench = false

[dependencies]
pi-protocol.workspace = true
tokio = { version = "1", features = [
  "net",
  "io-util",
  "rt",
  "process",
  "time",
  "sync",
  "macros",
] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
insta.workspace = true
tokio = { version = "1", features = [
  "net",
  "io-util",
  "macros",
  "rt",
  "process",
  "time",
  "sync",
] }
tempfile = "3"
