[package]
name = "pi-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pi-rs render thread, Retained Message Model, markdown pipeline, width engine, theme loader (ADR 0026)"

[lib]
name = "pi_render"
path = "src/lib.rs"

[dependencies]
ratatui = { workspace = true, features = ["crossterm"] }
crossterm.workspace = true
# Opaque payloads for RenderEvent/AssistantMessageEvent until Step 7 (D-E)
# defines the typed RenderMessage. §9.2 assumption.
serde_json = "1"
# Grapheme-cluster-aware width engine (ADR 0025, ADR 0032). Behind the
# GraphemeWidth trait (width.rs) so a swap is one impl.
runefix-core = "0.1"
# Markdown pipeline (ADR 0010, ADR 0033).
pulldown-cmark = { version = "0.12", default-features = false }
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"

[dev-dependencies]
insta.workspace = true
