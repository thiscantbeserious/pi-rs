[package]
name = "pi-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pi-rs render thread, Retained Message Model, markdown pipeline, width engine, theme loader (ADR 0026)"

[lib]
name = "pi_render"
path = "src/lib.rs"

[dependencies]
ratatui = { workspace = true, default-features = false, features = [
  "crossterm",
] }
crossterm.workspace = true
# Render-thread ↔ tokio channel (ADR 0013). The render thread is a plain
# std::thread that drains via try_recv (non-blocking, no runtime needed);
# only the Sender side is awaited on the tokio runtime in pi-core.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
insta.workspace = true
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
