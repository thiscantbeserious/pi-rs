name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Check & Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: sonar-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate coverage (LCOV)
        run: |
          cargo install cargo-tarpaulin --locked || true
          cargo tarpaulin --workspace --out Lcov --output-dir . -- --lib
        continue-on-error: true # coverage is best-effort; analysis still runs

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The quality-gate poll 403s on push-to-main when the project's main
      # branch isn't registered in SonarCloud (Administration > Branches).
      # It works on PRs. Run it on PRs (mandatory) and on push (advisory via
      # continue-on-error) until the main-branch setup is confirmed stable.
      - name: SonarCloud Quality Gate
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Zero new issues check
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Waiting for SonarCloud to finish processing..."
          sleep 10

          PR_NUMBER=${{ github.event.pull_request.number }}
          RESPONSE=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=thiscantbeserious_pi-rs&pullRequest=${PR_NUMBER}&issueStatuses=OPEN,CONFIRMED&sinceLeakPeriod=true&ps=50")

          TOTAL=$(echo "$RESPONSE" | jq -r '.total')

          if [ "$TOTAL" = "null" ] || [ -z "$TOTAL" ]; then
            echo "::error::Failed to query SonarCloud API"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "New issues on PR #${PR_NUMBER}: $TOTAL"

          echo "$RESPONSE" | jq -r '.issues[] | "  \(.rule) at \(.component):\(.line) — \(.message)"' 2>/dev/null

          if [ "$TOTAL" -gt 0 ]; then
            echo ""
            echo "::error::SonarCloud found $TOTAL new issue(s) on this PR. All new issues must be resolved before merging."
            echo ""
            echo "View issues: https://sonarcloud.io/project/issues?id=thiscantbeserious_pi-rs&pullRequest=${PR_NUMBER}&issueStatuses=OPEN,CONFIRMED&sinceLeakPeriod=true"
            exit 1
          fi

          echo "No new issues — clean!"
