# cargo-deny configuration (P16 guard, ADR 0024 "starts here").
#
# The P16 failure mode: duplicate crossterm/terminal-backend versions in one
# binary cause event-queue mismatches and state-restore races. pi-render is
# the sole crate that depends on ratatui/crossterm (ADR 0026); this config
# denies any duplicate version in CI so a crossterm/ratatui split is caught.
#
# Known transitive duplicates unrelated to the terminal-backend P16 guard:
# - syn 2.x (thiserror-impl) vs 3.x (serde_derive): near-universal Rust
#   ecosystem split, no safe resolution.
# - hashbrown 0.16/0.17: ratatui vs ts-rs tree split.
# The newer duplicate version is skipped (cargo-deny skips the "extra"
# version, keeping the older one). Remove the skips when the upstream trees
# unify.

[advisories]
# RUSTSEC advisories: warn (advisory until explicitly opted into blocking,
# matching the project gate discipline: AGENTS.md gates are never lowered).

[bans]
# P16: deny duplicate versions in the dependency tree. A crossterm or
# ratatui duplicate here is the P16 failure mode and fails the build.
multiple-versions = "deny"
# Deny wildcard versions for external crates, but allow them for
# workspace path dependencies (pi-protocol.workspace = true etc.).
allow-wildcard-paths = true

# Known transitive duplicates unrelated to the terminal-backend P16 guard.
[[bans.skip]]
name = "syn"
version = "2.0.119"

[[bans.skip]]
name = "hashbrown"
version = "0.17.1"

[licenses]
# pi-rs is MIT; dependencies must be compatible.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]

[sources]
# Only allow crates.io (no git deps, no private registries).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
