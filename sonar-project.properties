sonar.projectKey=thiscantbeserious_pi-rs
sonar.organization=thiscantbeserious
sonar.projectName=pi-rs

# Workspace layout (ADR 0011): sources live under crates/*/src, tests under
# crates/*/tests. The root tests/ dir holds e2e scripts only. Only crates
# with a tests/ dir are listed (pi-replay, pi-rs, pi-session have inline
# tests only).
sonar.sources=crates/pi-core/src,crates/pi-protocol/src,crates/pi-replay/src,crates/pi-rs/src,crates/pi-session/src
sonar.tests=crates/pi-core/tests
sonar.sourceEncoding=UTF-8

# Rust analyzer: the workspace Cargo.toml is at the repo root. The analyzer
# runs Clippy automatically against the workspace manifest. Pointing
# manifestPaths here is explicit (the default lookup also finds it).
sonar.rust.cargo.manifestPaths=Cargo.toml

# Coverage: cargo-tarpaulin emits LCOV. The CI Coverage job runs tarpaulin
# before this scan and writes lcov.info at the repo root.
sonar.coverage.lcov.reportPath=lcov.info
