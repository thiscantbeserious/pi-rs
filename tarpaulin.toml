# Coverage configuration for cargo-tarpaulin
# Run: cargo tarpaulin

[default]
# Fail if coverage drops below threshold
fail-under = 70.0

# Exclusions mirror agent-session-recorder's policy, adapted to the workspace:
# - crates/*/tests/*: integration test files themselves
# - */tests.rs: inline test modules
# - crates/*/src/main.rs: CLI entry point, tested via e2e
# TUI/terminal-bound modules will be added here as they appear (tested via e2e/snapshot).
exclude-files = ["crates/*/tests/*", "*/tests.rs", "crates/*/src/main.rs"]
